name: Tests

on: [push, pull_request]

jobs:
  katas:
    name: ${{ matrix.groupe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: [niveau-1, encapsulation, niveau-2, niveau-3, niveau-4, niveau-5]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer test -- --group=${{ matrix.groupe }}
